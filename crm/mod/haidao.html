<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研学平台Demo</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f5f5;
}

.page {
    display: none;
    padding: 12px;
}

.active {
    display: block;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.banner {
    height: 120px;
    border-radius: 12px;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.route {
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

.btn {
    background: #007aff;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-top: 10px;
}

.task {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.done {
    color: green;
}

.bottom-tab {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #fff;
    border-top: 1px solid #ddd;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- 首页 -->
<div id="home" class="page active">
    <div class="banner">🌴 海南研学探索</div>

    <div class="card">
        <h3>🔥 热门研学</h3>

        <div class="route" onclick="go('detail')">
            <div>
                <b>🌳 雨林探险2天1夜</b><br>
                ⭐4.8 ｜ 198人
            </div>
            <div>￥399</div>
        </div>

        <hr>

        <div class="route">
            <div>
                <b>🌋 火山地质营</b><br>
                ⭐4.6 ｜ 120人
            </div>
            <div>￥299</div>
        </div>
    </div>
</div>

<!-- 路线详情 -->
<div id="detail" class="page">
    <div class="card">
        <h2>🌳 雨林探险2天1夜</h2>
        <p>成为小小生物学家，探索海南热带雨林</p>

        <p><b>学科：</b>生物｜地理｜环境</p>

        <h3>🎯 任务预览</h3>
        <ul>
            <li>📸 拍摄红树林</li>
            <li>🐛 找3种昆虫</li>
            <li>💧 水质实验</li>
        </ul>

        <div class="btn" onclick="go('task')">开始任务体验</div>
    </div>
</div>

<!-- 任务页 -->
<div id="task" class="page">
    <div class="card">
        <h2>🎯 我的任务</h2>

        <div class="task done">✔ 拍摄红树林（已完成）</div>
        <div class="task">🐛 找3种昆虫（进行中）</div>
        <div class="task">💧 水质实验（未开始）</div>

        <div class="btn" onclick="alert('模拟提交成功')">提交当前任务</div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-tab">
    <div class="tab" onclick="go('home')">首页</div>
    <div class="tab" onclick="go('detail')">路线</div>
    <div class="tab" onclick="go('task')">任务</div>
</div>

<script>
function go(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
