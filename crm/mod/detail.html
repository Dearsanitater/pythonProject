<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则详情</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* 固定文件列表宽度，Excel 预览区域自适应 */
/* 让整体容器使用 Flex 布局 */
.d-flex {
    display: flex;
    align-items: flex-start; /* 顶部对齐 */
    gap: 15px;  /* 左右留点间距 */
}

/* 左侧文件列表 */
#file-list-container {
    width: 250px;  /* 固定宽度 */
    max-height: 400px; /* 限制高度 */
    overflow-y: auto;  /* 允许滚动 */
    background: #fff;
    border: 1px solid #ddd;
    padding: 10px;
    flex-shrink: 0; /* 防止被压缩 */
}

/* 右侧预览区域 */
#file-preview {
    flex-grow: 1; /* 占满剩余空间 */
    min-height: 300px;
    border: 1px solid #ddd;
    padding: 15px;
    background-color: #f9f9f9;
    overflow: auto; /* 允许滚动，防止溢出 */
}
.list-group-item.active {
    background-color: rgba(0, 42, 255, 0.22) !important;
    color: white !important;
}
.container {
            margin-top: 20px;
        }
        .checkbox-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .column {
            width: 45%;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .checkbox-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }



    </style>
</head>
<body class="container mt-4">

    <h2 class="mb-3">规则详情
    <button onclick="downloadF()">筛选并下载Excel</button>
        <a href="/detail/download" class="btn btn-primary">下载整个xlsx工作簿</a>
    </h2>
    <!-- 下拉框（同一行） -->

    <div id="filter-section" class="hidden">
        <h3>选择文件下载
        <button onclick="submitdownloadF()">  下载所筛选文件</button></h3>
        <div class="checkbox-container">
            <!-- 左规则复选框 -->
            <div class="column">
                <strong>规则列表</strong>
                <label><input type="checkbox" id="select-all-rules"> 全选</label>
                <div id="rules-checkboxes" class="checkbox-list"></div>
            </div>
            <!-- 中间文件复选框 -->
            <div class="column">
                <strong>文件列表</strong>
                <div id="files-checkboxes" class="checkbox-list"></div>
            </div>
            <div class="column">
            <strong>已选文件</strong>
            <div id="selected-files" class="checkbox-list"></div>
        </div>
        </div>

    </div>
    <!-- 文件列表 + Excel 预览（左右布局） -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="dropdown1" class="form-label">报告情况预览：</label>
            <select id="dropdown1" class="form-select"></select>
        </div>
    </div>
    <div class="d-flex">
        <!-- 左侧文件列表 -->
        <div id="file-list-container">
            <h4>Excel 文件列表：</h4>
            <ul id="file-list" class="list-group"></ul>
        </div>
        <!-- 右侧 Excel 预览 -->
        <div id="file-preview">
            <h4>文件预览（前几行）：</h4>
            <div id="preview-content">请选择一个文件进行预览</div>
        </div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const files = JSON.parse('{{ files|escapejs }}');
        const cf_rules = JSON.parse('{{ rules|escapejs }}');
        console.log(cf_rules)
        let selectedFiles = new Set();
        let selectedResult = new Set();
        function toggleFile(file, isChecked) {
            if (isChecked) {
                selectedFiles.add(file);
            } else {
                selectedFiles.delete(file);
            }
            renderSelectedFiles();
        }
    //右显示已选规则
        function renderSelectedFiles() {
            let selectedFilesList = document.getElementById("selected-files");
            selectedFilesList.innerHTML = "";
            console.log('渲染规则复选框')
            selectedFiles.forEach(file => {
                let div = document.createElement("div");
                div.textContent = file;
                selectedFilesList.appendChild(div);
            });

            selectedResult=JSON.stringify([...selectedFiles])
            console.log(typeof selectedFiles)
            console.log(selectedFiles)
        }
    //下载筛选内容
        function downloadF() {
            let cf_rules = JSON.parse('{{ rules|escapejs }}')

            let filterSection = document.getElementById("filter-section");

    // 切换展开/收起
    if (filterSection.classList.contains("hidden")) {
        filterSection.classList.remove("hidden");
    } else {
        filterSection.classList.add("hidden");
        return;  // 如果是收起操作，就直接返回，不执行后续代码
    }

    let rulesContainer = document.getElementById("rules-checkboxes");
    let filesContainer = document.getElementById("files-checkboxes");

    rulesContainer.innerHTML = "";
    filesContainer.innerHTML = "";

    // 生成左侧规则复选

    let rmap =new Map(cf_rules)
    for (let rule in files) {
        let checkbox = document.createElement("input");
        console.log(rule)
        checkbox.type = "checkbox";
        checkbox.value = rule;
        checkbox.className = "rule-checkbox";
        checkbox.onchange = updateFileSelection;

        let label = document.createElement("label");
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + rule));
        rulesContainer.appendChild(label);
        rulesContainer.appendChild(document.createElement("br"));
    }

    }
    function  submitdownloadF()
    {
            console.log('downloadfile',selectedResult)
            fetch('/detail/downloadf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: selectedResult
            })
            .then(response => {
            if (response.ok) {
                return response.blob();  // 返回文件 Blob 数据
            } else {
                throw new Error('文件下载失败');
            }
})
.then(blob => {
    // 创建一个下载链接
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'filename.xlsx';  // 设置文件名
    link.click();  // 触发下载
})
.catch(error => {
    console.error('下载错误:', error);
});
            {#window.location.href = `/detail/downloadf`;#}
    }

        function updateFileSelection() {
            let selectedRules = [...document.querySelectorAll(".rule-checkbox:checked")].map(cb => cb.value);
            let filesContainer = document.getElementById("files-checkboxes");
            filesContainer.innerHTML = "";

            let allFiles = [];

            selectedRules.forEach(rule => {
                files[rule].forEach(file => {
                    if (!allFiles.includes(file)) {
                        allFiles.push(file);
                    }
                });
            });

            // **如果有文件，插入全选按钮**
            if (allFiles.length > 0) {
                let selectAllCheckbox = document.createElement("input");
                selectAllCheckbox.type = "checkbox";
                selectAllCheckbox.id = "select-all-files";
                selectAllCheckbox.checked = allFiles.every(file => selectedFiles.has(file)); // 检查是否所有文件已选
                selectAllCheckbox.onchange = () => toggleAllFiles(selectAllCheckbox.checked, allFiles);

                let selectAllLabel = document.createElement("label");
                selectAllLabel.appendChild(selectAllCheckbox);
                selectAllLabel.appendChild(document.createTextNode(" 全选"));

                filesContainer.appendChild(selectAllLabel);
                filesContainer.appendChild(document.createElement("br"));
            }

            // **生成文件复选框**
            allFiles.forEach(file => {
                let checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = file;
                checkbox.className = "file-checkbox";
                checkbox.checked = selectedFiles.has(file);
                checkbox.onchange = () => toggleFile(file, checkbox.checked);

                let label = document.createElement("label");
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(" " + file));
                filesContainer.appendChild(label);
                filesContainer.appendChild(document.createElement("br"));
            });

    renderSelectedFiles();
}

       // 全选/取消全选功能
        function toggleAllFiles(isChecked, allFiles) {
            console.log('all is checkd')
            if (isChecked) {
                allFiles.forEach(file => selectedFiles.add(file));
            } else {
                allFiles.forEach(file => selectedFiles.delete(file));
            }

            document.querySelectorAll(".file-checkbox").forEach(cb => cb.checked = isChecked);
            renderSelectedFiles();
}
        document.getElementById("select-all-rules").addEventListener("change", function () {
            document.querySelectorAll(".rule-checkbox").forEach(cb => {
                cb.checked = this.checked;
            });
            updateFileSelection();
        });
        document.addEventListener("DOMContentLoaded", function () {
            // 从模板中获取传递的变量
            const rules = JSON.parse('{{ rules|escapejs }}');  // 规则列表
            const files = JSON.parse('{{ files|escapejs }}');  // 文件列表
            const ruleId = '{{ rule_id }}';  // 选中的 rule_id

            console.log('规则列表:', rules);
            console.log('文件列表:', files);
            console.log('当前选中的 rule_id:', ruleId);

            const dropdown1 = document.getElementById("dropdown1");
            const fileList = document.getElementById("file-list");
            const filePreview = document.getElementById("preview-content");

            // 填充规则下拉框
            rules.forEach(([id, name]) => {
                let option = new Option(name, id);
                if (id === ruleId) option.selected = true;
                dropdown1.appendChild(option);
            });

            // 更新文件列表
            function updateFileList() {
                const selectedRule = dropdown1.value;
                fileList.innerHTML = "";
                filePreview.innerHTML = "请选择一个文件进行预览";

                console.log('选中的规则 ID:', selectedRule);
                console.log('对应的文件:', files[selectedRule]);
                document.querySelectorAll("#file-list .list-group-item").forEach(item => {
                    item.classList.remove("active");
                });
                if (!files[selectedRule] || files[selectedRule].length === 0) {
                    filePreview.innerHTML = `<strong>暂无文件可预览</strong>`;
                    return; // 直接返回，不再执行下面的逻辑
                }
                if (files[selectedRule]) {

                    files[selectedRule].forEach(file => {
                        let li = document.createElement("li");
                        li.textContent = file;
                        li.classList.add("list-group-item");
                        li.style.cursor = "pointer";
                        li.onclick = function () {
                            previewFile(file,li);
                        };
                        fileList.appendChild(li);
                    });

                    // 自动预览第一个文件
                    if (files[selectedRule].length > 0) {
                        previewFile(files[selectedRule][0],document.createElement("li"));
                    }
                }
            }

            // 预览 Excel（模拟）
            // 预览 Excel（解析前几行数据）
            function previewFile(fileName,listItem) {
    filePreview.innerHTML = `<strong>加载中...</strong>`;


    // 当前选中的项加上高亮
    document.querySelectorAll("#file-list .list-group-item").forEach(item => {
        item.classList.remove("active");
    });

    // 当前选中的项加上高亮
    listItem.classList.add("active");
    // 假设文件可通过 URL 访问，例如 /media/excel/xxx.xlsx
    {#const fileUrl = `/media/excel/${fileName}.xlsx`;#}
    const fileUrl = `/media/excel/`;
    fetch(fileUrl)
        .then(response => response.arrayBuffer())  // 获取文件数据
        .then(data => {
            const workbook = XLSX.read(data, { type: "array" }); // 解析 Excel
            {#const sheetName = workbook.SheetNames[0]; // 获取第一个 Sheet#}
            console.log('filename',fileName);
            const sheet = workbook.Sheets[fileName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 }); // 转换为二维数组

            // 取前5行数据
            let previewHtml = "<strong>预览：</strong><table class='table table-bordered'><tbody>";
            jsonData.slice(1, 6).forEach(row => {
                previewHtml += "<tr>";
                row.forEach(cell => {previewHtml += `<td class="excel-cell">${cell !== undefined && cell !== "" ? cell : "&nbsp;"}</td>`;
                });
                previewHtml += "</tr>";
            });

previewHtml += `
            </tbody>
        </table>
    </div>
`;

            filePreview.innerHTML = previewHtml;
        })
        .catch(error => {
            console.error("Excel 解析失败:", error);
            filePreview.innerHTML = `<strong>加载失败！</strong>`;
        });
}


            // 监听规则选择变化
            dropdown1.addEventListener("change", updateFileList);

            // 初始化
            updateFileList();
        });
        document.addEventListener("DOMContentLoaded", renderRules);
    </script>

</body>
</html>
